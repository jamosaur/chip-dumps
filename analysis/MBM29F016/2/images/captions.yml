terminal-8x16-sets-a.png: "8×16 sets A0 and A1 at 0x000000–0x001FFF (512 glyphs): VT220 control-character pictures, ASCII, DEC Special Graphics, box-drawing pieces and Latin-1."
terminal-8x16-sets-b-cp437.png: "8×16 sets B0 and B1 at 0x080000–0x081FFF (512 glyphs): DEC Special Graphics with ASCII, then a complete IBM CP437 set."
