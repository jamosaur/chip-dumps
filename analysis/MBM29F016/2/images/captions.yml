national-8x16-cyrillic-kana.png: "Three 94-glyph 8×16 sets from 0x1FA5E0, 0x1FADE0 and 0x1FB5E0: Cyrillic in ЙЦУКЕН keyboard positions, hiragana and katakana, at 3× scale."
