gbk-16x16-symbols-a1-a3.png: "GBK 16×16 font, GB2312 symbol row A1 and full-width ASCII row A3, halves from 0x000000 and 0x080000 planes paired, at 3× scale."
gbk-16x16-gbk3-start-8140.png: "Start of the GBK/3 extension at code 8140 (丂丄丅丆…), from 0x002BF0 and 0x082BF0, at 3× scale."
gbk-16x16-user-area-a140.png: "Normally-empty GBK user area A140–A4A0, here filled with radical-grouped traditional characters (halves from 0x01A9F0 and 0x09A9F0 paired), at 2× scale."
