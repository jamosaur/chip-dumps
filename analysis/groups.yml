  sh-car-navigation-flash:
    title: SH car navigation firmware pair
    summary: Two MBM29F016A chips forming the 16-bit bus of a 4 MB SuperH firmware image for a Japanese car navigation unit with GPS and a CD-ROM map drive, c. 1996-97.
    kind: lanes
    bus_bits: 16
    lane_bits: 8
    banks: 1
    expected_members: 2
    identified_as: Japanese car navigation unit (SuperH, GPS, CD-ROM map drive)
    confidence: low
    facts:
      Bus: 16-bit, big-endian
      CPU: Hitachi SH-1/SH-2
      Image magic: AAAA... 12345678 at 0x10
      Sources: RCS 1996-1997 (cd.c, diag_gps.c, chg_routcom.c)
    members:
      - dump: MBM29F016A/18
        bank: 0
        lane: 0
        confidence: high
      - dump: MBM29F016A/7
        bank: 0
        lane: 1
        confidence: high
    wanted:
      - id: area0-boot
        what: Area-0 boot ROM that starts the image at 0x00800000
        look_for: "SH vector table at 0 with TRAPA 60-63 handlers ending A4/4C in the low 64 KB; code checking AAAA/BBBB/CCCC/DDDD + 0x12345678 and setting VBR to 0x00800074"
    created: 2026-11-18
    updated: 2026-11-18
