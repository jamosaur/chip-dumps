wanted:
  - id: lane0-chip
    what: "Chip index 0 (lane 0, D31-D24) of the same 4 x MBM29F016A Flash ROM bank"
    look_for: "FTL headers 24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20 at each 64 KB; never-rewritten units with LU = 4*sector+0 (0x00, 0x04 ...); sector 0 holding lane 0 of the POC-IDL loader from offset 0x400"
    why: "completes the loader image and supplies LU 0x00 (likely superblock/inode table) and other missing logical units"
  - id: lane2-chip
    what: "Chip index 2 (lane 2, D15-D8) of the bank"
    look_for: "same FTL header; LU 0x02 in sector 0 with lane 2 of the loader; never-rewritten units with LU = 4*sector+2"
    why: "third lane of the loader and missing flash-disk units"
  - id: lane3-chip
    what: "Chip index 3 (lane 3, D7-D0) of the bank"
    look_for: "same FTL header; LU 0x03 in sector 0 with lane 3 of the loader; never-rewritten units with LU = 4*sector+3"
    why: "fourth lane of the loader and missing flash-disk units"
  - id: fs-inode-table
    what: "NS-OS flash-disk superblock and inode table (FS blocks below 0x6F2, logical units 0x00-0x0D not present here except 0x01/0x05/0x0D)"
    look_for: "structures mapping inode numbers (root=0, admin=1, bin=2, boot.3rd=440, nsx.sys=467, pocvup=469) to block lists in LU*127 numbering"
    why: "needed to extract named files from the reassembled volume"
  - id: ns2482-boot-rom
    what: "Separate boot ROM holding the 1st/2nd boot stages and the 68k reset vectors"
    look_for: "68k vector table, strings like '2nd Boot', 'bootconf', NS-2482 or SII"
    why: "the flash bank starts with FTL headers at CPU address 0, so the CPU must reset from another device"
