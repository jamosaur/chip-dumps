wanted:
  - id: ftl-chips-1-3
    what: "The other three chips of the 8 MB xflush flash disk (logical units 4k+1, 4k+2, 4k+3 in their never-rewritten blocks)"
    look_for: "MBM29F016-class 2 MB images where every 64 KB unit starts 24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20, the word at +0x24 = 4*index+1/2/3 in untouched units, and none of this chip's logical numbers (00 04 0C 0F 15 16 1D 25 29 2D 31 35 39 3A 40 41 43 44 48 52 55 5A 5E 60-7C step 4) repeated"
    why: "completes the 128-unit logical space so the file system (superblock, inodes, /version) can be rebuilt"
  - id: boot-lanes-1-3
    what: "Byte lanes 1-3 of the boot image striped across logical units 1-3"
    look_for: "unit 0 of a partner chip with the same xflush parameter sector at 0x200 and lane-split 68k bytes from 0x000400 to about 0x003877 (low bytes of opcodes, e.g. 75 after 4E positions)"
    why: "interleaving the four lanes yields the ~55 KB boot loader and its entry point"
  - id: fs-superblock
    what: "File-system superblock, inode table and root directory (32-byte dir entries: BE32 inode + 28-byte name)"
    look_for: "directory sectors for /, /setup, /sbin, /bin, /share, /admin, /etc; inode 0x12 is the parent of the /setup-style directory with inode 0x194"
    why: "needed to map files to sectors and recover names of the 41 ABCD0200 executables"
  - id: version-file
    what: "/version file contents and any product banner"
    look_for: "short text file shown by 'show -a /version'; vendor or model name strings"
    why: "would identify the maker and model of the router"
