  lane_evidence: "Holds the low (odd-address, D7-D0) byte of big-endian SH instructions (0B 09 = rts/nop, E6 D6 C6 ... = mov.l rN,@-r15) and characters 1,3,5,7 of word-aligned '$Header:' strings ('Hae:'); pointers decode as bytes 1 and 3 of BE 32-bit words."
