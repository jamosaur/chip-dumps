layout: "0x74-byte image header, 256-entry vector table at image offset 0x74, record table, interrupt stubs, code to chip 0x1A2000, constant data/rcsid strings to 0x1F2000, late code + math constants to 0x1F3F48, erased to end. CPU address = 0x00800000 + 2*offset + 1."
