  - offset: "0x0A4E62"
    text: " VLSERVER STATISTICS"
  - offset: "0x0A9DAF"
    text: "VOID\tFUNCTION buildINS1500[sccno:INTEGER;hp:INTEGER;sp:INTEGER;"
  - offset: "0x0E69D4"
    text: "[promaryISDN]"
  - offset: "0x10BE4A"
    text: "<for lapd driver (SAPI0)>"
wanted:
  - id: boot-lanes
    what: "The other three byte lanes of the 68k boot program in unit 0"
    look_for: "MBM29F016A-size image whose unit 0 has the same 24 11 00 80 header with L=00, 02 or 03 and non-zero stride-4 data at 0x000400-0x000EB0 and 0x001000-0x003880; even lanes should show 68k opcode high bytes (4E, 48, 2F, 20, 61, 66)"
    why: "interleaving all four reconstructs the boot/loader program and confirms the lane order"
  - id: fs-partner-chips
    what: "The other three chips of the four-chip flash disk"
    look_for: "64 KB units each starting 24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20, never-erased units numbered 4n+0, 4n+2 or 4n+3 at +0x24, 0xABCD 0200 0532 executables, /setup/wanN text files"
    why: "completes the ~8 MB volume (128 logical units) so files can be reassembled"
  - id: fs-metadata
    what: "Superblock, directories and block-translation tables"
    look_for: "directory entries naming setup files (hostname, gateways.static, telnet.def), a map from block numbers 0x24B2-0x2F66 to unit/offset, logical unit 0x00"
    why: "inode block numbers here cannot be mapped to unit offsets without it"
  - id: version-file
    what: "The /version file and product banner"
    look_for: "text referenced by 'show -a /version'; product/model name, firmware version"
    why: "identifies the maker and model of the router"
