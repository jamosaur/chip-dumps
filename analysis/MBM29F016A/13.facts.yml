dump: MBM29F016A/13
kind: whole-image
bus:
  width_bits: 32
  stride: 4
  lane: null
  lane_evidence: "File-system data is linear on this chip (each chip managed as its own byte stream); only the boot program at 0x000400-0x003880 is stride-4. Its byte histogram (8F EF 75 6F 7C 79 DF E7 = low bytes of 588F/4FEF/4E75/4879/4CDF/48E7) puts it on an odd lane (1 or 3); format-time logical unit numbers 4n+1 suggest chip index 1."
bit_order: normal
endianness: big
architecture: "68k (68020 or later; bsr.l 61FF used throughout)"
identification:
  device: "Japanese multi-port WAN router / access server (ISDN BRI+INS1500 PRI, HSD leased line, frame relay, PPP, OSPF, up to 30 WAN ports) with an 8 MB four-chip flash disk"
  maker: null
  confidence: low
layout: "32 x 64 KB units, each with a 64-byte header (24 11 00 80 ...); unit 0 holds a stride-4 boot-program lane at 0x400-0x3880; units 2,4-23 hold 512-byte file blocks (55 0xABCD executables, setup text, inode table at 0x0F0200); units 1,3,24-31 are header plus zero fill"
structures:
  - offset: "0x000000"
    type: "flash unit header (repeated at every 64 KB unit)"
    detail: "bytes 0x00-0x13 constant; BE u16 at +0x24 logical unit number, +0x26 erase count, +0x2C/+0x2E repeated count. Never-erased units have L = 4n+1 (unit 0 L=01, unit 8 L=21, unit 31 L=7D); erased units have L 4F,3F,19,1A,1E,26,2A,2F,33,36,3A,09,4C,47,3B,4E,1F,55,59,5C"
    raw: "24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20"
  - offset: "0x000400"
    type: "68k boot program, one byte lane of a 32-bit interleave (block A, to 0x000EB0)"
    detail: "begins 42 F6 00 00 3C 00 7A 00 02 00 02 75 80 02 98 3C; a second block starts at 0x001000 with 50 F6 07 00 01 00 and runs to 0x003880"
    raw: "42 f6 00 00 3c 00 7a 00"
  - offset: "0x000E62"
    type: "C ctype table, every 4th entry (lane-split)"
    detail: "20 20 20 28 20 20 20 20 48 10 10 10 04 04 04 10 10 81 01 01 01 01 01 10 10 82 02 02 02 02 02 10 = chars 0,4,8,...,124"
  - offset: "0x0001FF"
    type: "single flag byte in boot unit"
    raw: "fb"
  - offset: "0x027E00"
    type: "executable header (0xABCD format), 55 instances on chip"
    detail: "AB CD 02 00 05 32 00 00 06 55 06 55 06 55 then nsect; header size 0x110 or 0xF0; section names code/const/string/data/ram at +0x50 (0x1C stride); section entries (type, offset, size, size) from about +0xD0; type-2 files begin 4EF9 00000008 4E71"
    raw: "ab cd 02 00 05 32 00 00 06 55 06 55 06 55"
  - offset: "0x0F0200"
    type: "inode table, 111 x 128-byte entries"
    detail: "+02 mode as hex-coded octal (0755/0664/0777), +04 nlink, +0A size u32, +16/+1A times 1998-08-31 / 1999-03-25, +1E nblocks, +22 block list u32 (0x24B2..0x2F66), +76 mtime 1999-03-17..29"
    raw: "00 00 07 55 00 01 00 00 00 00 00 00 02 d7"
  - offset: "0x080200"
    type: "setup file index text"
    detail: "maps names to /setup/common/*, /setup/default/*, /setup/ttyp/*, /setup/wan1..30/{fr,hsd,layer2,ppp}"
strings_of_note:
  - offset: "0x022376"
    text: "Usage:pppstat vl (4096/4097/1048576/17825792) (cmd)"
  - offset: "0x023524"
    text: "Mode        :%d(TP)"
  - offset: "0x02357C"
    text: "Service     :%d(HSD)"
  - offset: "0x02C4D2"
    text: "stdio / libmisc / libperr / libmem"
  - offset: "0x029563"
    text: "core dump flag (off|card|ftp): %s"
  - offset: "0x0296E0"
    text: "**** Boot parameter ****"
  - offset: "0x02970B"
    text: "boot mode      (mem|net|auto): %s"
  - offset: "0x0297CC"
    text: "local MAC address : %02X:%02X:%02X:%02X:%02X:%02X"
  - offset: "0x02DA91"
    text: "$PLUGIN[\"initwan\";FALSE]"
  - offset: "0x079ED2"
    text: "PH:ISDN Cable Off"
  - offset: "0x081DA0"
