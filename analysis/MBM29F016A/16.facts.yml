  - offset: "0x0A4646"
    type: "8-bit unsigned PCM audio, every other sample"
    detail: "to 0x159668; silence 80/7E; value 7F rare"
  - offset: "0x15B900"
    type: "graphics index"
    detail: "field '00 03' then 510 pointers (0E7A, 0E7C, ... step 0x204 bus bytes for the first 88)"
    raw: "00 03 0e 7a 0e 7c 0e 7e 0e 80"
  - offset: "0x15BCFE"
    type: "4bpp image records, 0x102 bytes each on this chip"
    detail: "16-byte prefix (palette or mask), header '20 00', 240 bytes pixels = 32x30 4bpp; records 0-31 heading arrow (32 directions), 32-87 cartoon mascot animation; 1bpp bitmaps from 0x1616B2"
  - offset: "0x183020"
    type: "asctime() stamp, even characters"
