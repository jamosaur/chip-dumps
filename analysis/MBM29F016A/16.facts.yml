dump: MBM29F016A/16
kind: byte-lane
bus:
  width_bits: 16
  stride: 2
  lane: 0
  lane_evidence: "Holds bytes 0 and 2 of every 32-bit vector (0E 40 / 0F FF = PC 0x0E?40??, SP 0x0F?FF??) and the high bytes of SH opcodes (D3 43 00 = mov.l/jsr/nop); SH-1 is big-endian, so these are the even addresses, D15-D8"
bit_order: normal
endianness: big
architecture: "Hitachi SH-1 (SH7032/SH7034 family), 114-entry vector table"
identification:
  device: "Japanese in-car navigation / road-traffic-information unit (VICS era), with voice guidance and mascot graphics"
  maker: null
  confidence: low
layout: "640 KB SH-1 code/data (0x000000-0x0A0D12); string table + 8-bit PCM (0x0A4000-0x159668); 4bpp/1bpp graphics with 510-entry index (0x15B900-0x183000); Fujitsu-stamped tables + 4-bit ADPCM (0x183000-0x19B1CC); shape tables; 8x16 font + two JIS X 0208 kanji fonts (0x1A5C70-0x1F7000); zeros to end"
address_map: "chip offset o = CPU address 0x0E000000 + 2*o (verified by pointer tables); RAM pointers 0x09xxxxxx; on-chip I/O 0x05FFFExx-0x05FFFFxx; SP in on-chip RAM 0x0FFFFxxx"
structures:
  - offset: "0x000000"
    type: "SH7032/7034 exception vector table, 114 vectors (bytes 0 and 2 of each)"
    detail: "v0-3 PC/SP/PC/SP = 0E40 0FFF 0E40 0FFF; v4-12 0E44 0E40 0E44 0E40 0E40 0E44 0E44 0E41 0E44; v13-59 0E10 (default); TRAPA v60-63 0E1D 0E1C 0E06 0E06; IRQ0 0E41, IRQ1-7 0E42; ITU 0E5C/0E5D/0E5E; SCI 0E45; PEI/ADI/WDT/CMI 0E46; reserved 0E40"
    raw: "0e 40 0f ff 0e 40 0f ff 0e 44 0e 40 0e 44 0e 40"
  - offset: "0x0003F3"
    type: "copyright string, even characters"
    detail: "'Cprgt19 iah,t.' = even chars of 'Copyright 199x Hitachi,Ltd.'; followed by 'IS7H00IC1MV. 93' (OS/library id, 1993)"
  - offset: "0x0655DC"
    type: "RCS $Id$ string, even characters"
    detail: "'$d motcv1219/12 13:8kmEpkm$' -> '$Id: ?m?o?t.c,v 1.x 199x/x1/2x x1:3x:x8 k?m Exp k?m $'"
  - offset: "0x0655F8"
    type: "'Mint' tagged records (41 occurrences to ~0x06AC9C)"
    detail: "4D 69 6E 74 then 0930/0913 RAM pointers and flag words"
    raw: "4d 69 6e 74 00 00 00 00 09 2e 00 00 09 13 00 00"
  - offset: "0x0A4000"
    type: "string pointer table, 231 entries (bytes 0 and 2 of 32-bit pointers)"
    detail: "values 0E83..0E8C -> strings at 0x0E1483xx-0x0E148Cxx"
    raw: "0e 83 0e 83 0e 83 0e 83"
