  - id: boot-rom
    what: "Boot code at SH-1 address 0 (area 0), if the board has a separate boot ROM or uses SH7034 on-chip ROM"
    look_for: "SH-1 vector table whose reset PC is in area 0 and which jumps to or sets VBR to 0x0E000000"
    why: "the vectors in this image point into H'E000000, so something else may start it"
