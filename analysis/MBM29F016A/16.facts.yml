wanted:
  - id: sh1-low-lane
    what: "Odd-address byte lane (D7-D0) of the same 4 MB SH-1 image"
    look_for: "at 0x0003F3 the odd chars of the copyright: 'oyih 9' + digit + 'HtciLd'; at 0x000000 vector bytes 1/3 (SP low bytes likely 'FF xx'); SH opcode low bytes (0B 09 after jsr = 430B/0009 -> partner bytes '0B 09'); at 0x0A4646.. 8-bit PCM continuing the same waveforms; at 0x183020 'r c ' + day digit + time digits"
