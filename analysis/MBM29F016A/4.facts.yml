wanted:
  - id: poc-idl-other-lanes
    what: "Lanes 0, 1 and 3 of the POC-IDL Ver 3.0 boot image in sector 0 (chip offsets 0x400-0x3876)"
    look_for: "Sector 0 with a 24 11 00 80 unit header (unit id 0x0000, 0x0001 or 0x0003), zero to 0x400, then high-density lane-split 68k code ending near 0x3876"
    why: "Interleaving the four lanes rebuilds the boot program at CPU 0x1000 and its entry point"
  - id: fs-other-chips
    what: "The other three chips of the same file-system volume (128 units in total)"
    look_for: "MBM29F016A images where every sector starts with 24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20, with untouched unit ids 4*sector+{0,1,3}, ABCD 0200 file headers and NS-2482 strings"
    why: "Holds the rest of the directory blocks, inode and block-map data, and the remaining parts of nsx.sys and other files"
