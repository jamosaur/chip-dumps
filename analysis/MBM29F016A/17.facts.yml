wanted:
  - id: boot-other-lanes
    what: "The other three byte lanes of the boot image in unit 0 (chip offsets 0x000400 to about 0x003875)"
    look_for: "MBM29F016A-size image with 0x2411 unit header at 0x0 and logical unit 0x00/0x02/0x03 at 0x24, unscrambled-looking data from 0x000400 that interleaves (stride 4) with this lane into 68k code and strings such as 'initialize memory card NG. no card.' and 'Vect #%d %s SR=0x%04X PC=0x%08X'"
    why: "reconstructs the 2nd boot loader and fixes this chip's lane (1 or 3)"
  - id: fs-other-chips
    what: "Chips 0, 2 and 3 of the same flash file system: the remaining logical units of the ~8 MB volume"
    look_for: "64 KB units starting '24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20', untouched units numbered 4*unit+0/2/3 at 0x24, ABCD 02 00 05 32 executables, /setup and $PLUGIN scripts"
    why: "completes the file system, including files cut off here (e.g. L=0x4E continues the executable at 0x025C00)"
  - id: fs-directory
    what: "File-system root, directory and allocation structures (not present on this chip), probably in logical unit 0x00"
    look_for: "entries holding names like servers, ospfrestart, initSubr.r, nsx.sys, setupfile.def in a 0x2411-unit image"
    why: "gives file names and lets every file be extracted"
  - id: nsx-os
    what: "The OS image /nsx.sys loaded by the 3rd boot"
    look_for: "a large ABCD 02 00 05 32 executable (hundreds of KB) with kernel, TCP/IP and driver strings"
    why: "would identify the OS and probably the product name/version"
