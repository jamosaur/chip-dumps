wanted:
  - id: cisco-c2600-lane-0
    what: "Bank lane 0 (bits 31-24, address 4k+0) of the same 8 MB flash bank"
    look_for: "first bytes BA (flash magic) at chip 0x000000; ELF 7F at 0x000010; ZIP 'P' at 0x001140; PowerPC opcode bytes (94 7C 80 90 38 4E 48/4B) through 0x000E00; Cisco text one char in four near 0x000E30-0x00113A; deflate data to end; possibly the same D0/D2 swap"
    why: "completes the code, strings, CW_ block and ZIP header; gives file length and ZIP signature byte 0"
  - id: cisco-c2600-lane-1
    what: "Bank lane 1 (bits 23-16, address 4k+1)"
    look_for: "D0 at chip 0x000000 (BAD00B1E byte 1), 'E' at 0x000010, 'K' at 0x001140; PowerPC rD/rA bytes such as 21 (r1) and 08 (mflr/mtlr) in the code area; FF FF FF... in stwu/bl high displacement bytes"
    why: "holds ZIP version/method high bytes and name chars 3,7,11; needed for full image interleave"
  - id: cisco-c2600-lane-3
    what: "Bank lane 3 (bits 7-0, address 4k+3)"
    look_for: "1E at chip 0x000000 (BAD00B1E byte 3), 'F' at 0x000010, 04 at 0x001140 (PK\\x03\\x04), ZIP name chars 1,5,9; PowerPC low bytes A6 (mflr/mtlr), 78 (mr), 20 (blr) in the code area"
    why: "holds the instruction low bytes and ZIP name/CRC/size low parts; with lanes 0-2 lets the IOS image be unzipped"
  - id: cisco-ios-zip-end
    what: "End of the mzip ZIP archive (central directory and end-of-central-directory record) and the end of the flash file"
    look_for: "lane-split PK 01 02 / PK 05 06 records after the deflate data, either at the top of this bank across the four lanes or in a second bank"
    why: "gives the member name, sizes and CRC; this lane shows no end record, so the archive may run past the end of this bank"
