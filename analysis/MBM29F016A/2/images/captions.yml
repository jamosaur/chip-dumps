sector-map.png: "Content of the 32 × 64 KB sectors (axis labels are the top three hex digits of the offset, e.g. 040 = 0x040000)."
terminal-8x16-sets-bank0.png: "8×16 1-bpp single-width sets at 0x000000 (cells 0–511): control pictures + ASCII, DEC Special Graphics, a box/block graphics set and ISO Latin-1."
terminal-8x16-sets-bank1.png: "8×16 1-bpp single-width sets at 0x080000 (cells 0–511): ASCII with DEC graphics in 0x00–0x1F, and the full IBM code page 437."
gbk-16x16-symbols-a1-a9.png: "16×16 GBK font, GB2312 symbol rows A1–A9, built from left halves at 0x000000 and right halves at 0x080000; note the vendor extras (card suits, pointing hands, accented Latin)."
gbk-16x16-gb2312-b0-b1.png: "16×16 GBK font, GB2312 hanzi rows B0–B1 (啊 阿 埃 … 薄 雹 保 …), cell = 704 + GBK index."
gbk-16x16-gbk3-row-81.png: "16×16 GBK font, first GBK/3 extension row 0x8140–0x81FE (丂 丄 丅 …), at offsets 0x002C00 / 0x082C00."
gbk-16x16-user-area-a1-a2.png: "16×16 cells for user-defined codes A140–A2A0: filled with copies of rows AC and AD (trail 40–A0) instead of being blank."
font24-lane-vs-16x16.png: "Top: 16×16 glyphs from the lower half; bottom: the same codes in the 32-byte cells at 0x100000, an 8-pixel column lane of a larger (probably 24-dot) font."
font24-lane-gb2312-row-b0.png: "GB2312 row B0 from the 24-dot lane at 0x100000 + 32 × cell, 8 pixels wide × 26 rows, scaled 3×."
national-8x16-russian-hiragana-katakana.png: "8×16 national replacement sets at 0x1FA5D0, 0x1FADD0 and 0x1FB5D0 (characters 0x20–0x7F): Russian KOI-7 style, hiragana and katakana."
