dump: MBM29F016A/3
kind: whole-image
bit_order: normal
endianness: big
architecture: "68k (68EC040 main CPU; MC68360 QUICC comms processors)"
identification:
  device: "Japanese multi-port ISDN BRI/PRI, HSD and frame-relay access router running NS-OS 3.1"
  maker: null
  confidence: low
layout: "Chip 0 of a 4-chip 8 MB flash-translation-layer disk: 32 x 64 KB units, each with a 64-byte header carrying a logical unit number at +0x24, payload 0x200-0xFFFF. 21 units in use (68k AB CD 02 00 executables, kernel, scripts), 11 zero-filled. Sector 0 holds the partition record at 0x200 and, at 0x400-0x3876, probably one byte lane of a 32-bit interleaved boot program."
structures:
  - offset: "0x000000"
    type: "FTL unit header (same in all 32 sectors)"
    detail: "constant prefix; +0x24 u16 logical unit number; +0x26 u16 unknown (0-8); +0x2C and +0x2E u16 repeated, probably the erase count (1-9). Free units have logical = 4*physical, so this is chip 0 of 4."
    raw: "24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20"
  - offset: "0x000200"
    type: "partition record text"
    detail: "flush(FLUSH-EEPROM boot/partition(boot=512k) 8M byte(erase block = 64Kbyte); byte 0x78 at 0x0001FF"
  - offset: "0x000280"
    type: "partition geometry (u32 BE)"
    detail: "7F,0,1,7F,200,3F8,0,3F01,0,1D45,194D,9EC,1F41,1FC0: 127 units, 512-byte sectors, 16129 sectors; others are sector numbers at units 8,59,51,20,63,64"
    raw: "00 00 00 7f 00 00 00 00 00 00 00 01 00 00 00 7f 00 00 02 00 00 00 03 f8"
  - offset: "0x0003FC"
    type: "unknown trailer of partition sector"
    raw: "c3 46 df ff"
  - offset: "0x000400"
    type: "byte lane of a boot program (probably lane 0 of 4, 32-bit)"
    detail: "0x400-0x3876, then zero to 0xFFFF; histogram matches 68k opcode high bytes; first bytes below"
    raw: "32 03 00 00 61 60 4e 08 67 08 67 4e 42 00 f4 20"
  - offset: "0x043200"
    type: "NS-OS executable header (50 on chip, 512-byte aligned)"
    detail: "0x110-byte header; +0x28 header size 0x110, +0x2C image end, +0x30/+0x34 file length; sections code/const/string/data/ram with 16-byte records at +0xD0; trailing 20-byte records starting 00 20 20 1B"
    raw: "ab cd 02 00 05 32 00 00 06 55 06 55 06 55"
  - offset: "0x045A3C"
    type: "syscall stub tail and library list"
    detail: "TRAP #4; RTS followed by stdio, libperr, libmisc, libsetup"
    raw: "4e 44 4e 75 73 74 64 69 6f 00"
  - offset: "0x12F518"
    type: "68040 cache control code"
    detail: "MOVEC CACR,D0; BTST #31/#15; CPUSHA DC (F478 at 0x12F522); CINVA IC (F498 at 0x12F52A)"
