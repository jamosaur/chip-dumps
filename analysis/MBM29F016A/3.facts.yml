wanted:
  - id: ftl-chips-1-3
    what: "The other three chips of the 8 MB flash disk (chips 1, 2, 3 of 4)"
    look_for: "64 KB sectors starting 24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20; unused units with logical number (+0x24) = 4*sector+1, +2 or +3; logical units absent here (e.g. 01-03, 05-0B, 0D, 0E, 10-12, 14, 16-1B, 1E, 1F, 49, 4B, 55)"
    why: "the volume is striped across four chips by 64 KB unit; together they rebuild the full 127-unit file system"
  - id: unit-continuations
    what: "Logical units that continue data cut off here"
    look_for: "L0x1E starting after PPP strings (L0x1D ends 0x07FFFF), L0x45 continuing the 00 20 20 1B record table from L0x44, L0x49 after the kernel strings and NS-OS executable in L0x48, L0x55 after L0x54"
    why: "files run across logical unit boundaries"
  - id: boot-lanes
    what: "Other three byte lanes of the 32-bit boot program in boot-partition sector 0 (and possibly sector 1)"
    look_for: "physical sector 0 with logical unit 1, 2 or 3 and lane-like data from offset 0x400 to about 0x3877, then zero"
    why: "interleaving four lanes should give readable 68k boot code and strings like the P0..P5 / A1 table"
  - id: fs-metadata
    what: "File-system directory and allocation sectors"
    look_for: "logical units 0x08, 0x14, 0x33, 0x3B, 0x3F (sector numbers 0x3F8, 0x9EC, 0x194D, 0x1D45, 0x1F41 from the partition record)"
    why: "file names and the block map for the AB CD 02 00 executables are not on this chip"
  - id: vendor-identity
    what: "sysDescr / sysObjectID values, the banner or a model name"
    look_for: "SNMP default strings, an enterprise OID 1.3.6.1.4.1.x, or the login banner in the setup files or snmpd"
    why: "names the maker and model of the router"
