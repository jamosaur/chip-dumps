wanted:
  - id: ns2482-flashdisk-units-0mod4
    what: "Flash-disk units originally numbered 4s+0 (chip index 0 of the 4-chip set)"
    look_for: "2 MB image whose every 64 KB sector starts 24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20, with unit numbers (u16 at +0x24) 0,4,8... in sectors that still have erase count 1"
    why: "holds the other quarter of the NS-2482 flash disk, including logical unit 0 of the raw boot area"
  - id: ns2482-flashdisk-units-1mod4
    what: "Flash-disk units originally numbered 4s+1 (chip index 1)"
    look_for: "same 0x2411 unit header; unit numbers 1,5,9,13... in ec=1 sectors"
    why: "includes inode-table units 9 and 13 (inodes 480-987: /sbin, /share and /version entries that this chip lacks)"
  - id: ns2482-flashdisk-units-2mod4
    what: "Flash-disk units originally numbered 4s+2 (chip index 2)"
    look_for: "same 0x2411 unit header; unit numbers 2,6,10,14... in ec=1 sectors"
    why: "includes inode unit 10 and unit 14, which holds the first root-directory block (logical block 0x6F2) and the start of the data area"
  - id: ns2482-raw-boot-area
    what: "Raw area before the filesystem, logical blocks 0-1015 (units 0-7)"
    look_for: "units 0,1,2,4,5,6 (on the partner chips) with the same scrambled-ASCII binary seen at 0x000400 here, or a boot/extended-POC image"
    why: "probably the boot or Extended POC image; only units 3 and 7 are here and they are almost empty"
  - id: ns2482-version-files
    what: "/version (inode 589) and /os_version (inode 468) contents"
    look_for: "inode table units 9/10/13 and the blocks they point to; text like 'Communication Server NS-2482 System Software ... (Ver x.x)'"
    why: "dates the 1999-07-12 software update installed on this unit"
  - id: ns2482-boot-prom
    what: "Boot PROM (POC) of the NS-2482"
    look_for: "68k (CPU32/MC68360) boot code with strings 'POC', 'Pocvup', 'bootconf', BDEV boot-device selection (2 = memory card, 3 = flash ROM)"
    why: "the flash disk is loaded by a separate POC monitor that is not on this chip"
