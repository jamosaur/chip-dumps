  - id: ns2482-inode-table
    what: "Main inode table / superblock covering inodes 1-470 (root, bin, driver, nsx.sys:467, pocvup:469, boot.3rd:440)"
    look_for: "128-byte records with mode 0x0755/0x0664 written as hex digits, Unix times around 0x35EA41xx (1998-08-31) and 0x3789xxxx (1999-07), u32 block lists"
    why: "needed to reassemble files, especially the nsx.sys OS image, across all four chips"
  - id: ns2482-ipl-full
    what: "Complete 32-bit IPL image from interleaving sector 0 of all four chips"
    look_for: "after interleave, a 68k program from CPU offset 0x1000 containing 'POC-IDL' style exception table and '0123456789ABCDEF' at about CPU offset 0xE170"
