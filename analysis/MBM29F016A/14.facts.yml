wanted:
  - id: ns2482-flash-chips-0-2
    what: "The other three MBM29F016A chips of the same 8 MB flash disk (logical units not on this chip, e.g. 0-2, 4-6, 9, 10, 12-16, 18, 21, 22, 24-27, 29-31 ...)"
    look_for: "every 64 KB unit starting 24 11 00 80 00 00 00 80 00 01 00 80 00 01 02 00 00 40 00 20; unmoved units (+0x26 = 0) with logical (+0x24) = 4*physical + 0/1/2; NS-2482 / SII strings; no logical number duplicated with this chip's list"
    why: "completes the file system: label/superblock, block map, file-index (inode) table and the rest of the files"
  - id: ns2482-boot-lanes-0-2
    what: "Byte lanes 0-2 of the 32-bit 68k image whose lane 3 is at 0x000400-0x003875 here"
    look_for: "unit 0 of the partner chips (logical 0, 1, 2) with non-contiguous data from 0x000400 to about 0x003876; interleaving the four should give readable 68k code and a normal ctype table"
    why: "recovers the boot/monitor code and fixes the lane order"
  - id: ns2482-kernel
    what: "The operating-system kernel image (probably the file whose deleted root entry ends in 'sx.sys') and the trap #4 shared-library loader"
    look_for: "68020 code with an exception vector table, references to stdio/libmem/libctype shared libraries, same 2411 unit headers"
    why: "identifies the OS and the executable and flash-driver formats"
