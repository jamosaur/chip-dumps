dump: AM29F016B/13
kind: byte-lane
bus:
  width_bits: 32
  stride: 4
  lane: 0
  lane_evidence: "Bytes are the top bytes of PowerPC instructions (38/3C addi/addis, 7C opcode 31, 80-83 lwz, 90-93 stw, 48/4B b, 4E blr); consecutive bytes are consecutive instructions (94 7C 93 = stwu/mflr/stw, 7C 4E = mtlr/blr). Big-endian ARM code in block 2 also shows its condition/top byte (E0-EB). So this chip is D0-D7, the most significant byte."
bit_order: normal
endianness: big
architecture: "PowerPC (32-bit, big-endian) main CPU; also big-endian ARM code embedded in the image"
identification:
