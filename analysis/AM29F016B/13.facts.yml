  maker: null
  confidence: low
layout: "Chip sector N = 256 KB CPU block N, each starting with an 'M' header. Block 0: boot block with reset stub at CPU 0x100, boot code at CPU 0x2100-0x63CC, 63-record table at CPU 0x20000. Block 1: standalone sparse FF-heavy data (~211 KB CPU, possibly FPGA bitstream). Blocks 2-9: one chained image (~1.8 MB CPU) with big-endian ARM firmware first (block 2), then PowerPC code and string tables, block 8 almost all zero, ends at chip 0x094778. Chip 0x0A0000-0x1EFFFF erased. Block 31 (chip 0x1F0000): different header 'M\\0RN', 4-byte records, settings, last byte 4D."
