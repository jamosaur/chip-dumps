wanted:
  - id: ppc-lane-1
    what: "Lane 1 (D8-D15) of the same 32-bit PowerPC flash bank"
    look_for: "Sector starts with lane-1 bytes of the 'M' block header (same 64 KB sector boundaries used in sectors 0-9 and 31, sectors 10-30 erased); code regions whose bytes are the second byte of PowerPC instructions (register fields, e.g. 21 after stwu, 08 after mflr, 80 after blr's 4E); erased exactly where this chip is erased (from 0x094778 to 0x1EFFFF)"
    why: "Needed to read instructions, strings and header fields"
  - id: ppc-lane-2
    what: "Lane 2 (D16-D23) of the same bank"
    look_for: "Same sector usage pattern (data in sectors 0-9 and 31, end of image near chip 0x094778); PowerPC third bytes (e.g. 02 in mflr 7C0802A6, 00 in blr 4E800020)"
    why: "Completes the 32-bit words with lanes 1 and 3"
  - id: ppc-lane-3
    what: "Lane 3 (D24-D31, least significant byte) of the same bank"
    look_for: "Same sector usage; PowerPC low bytes such as A6 (mflr/mtlr 7C0803A6), 20 (blr 4E800020), branch displacement low bytes; lane-split printf text with 4-char periodicity"
    why: "Last lane; with all four the help text, D: debug messages, block headers and the ARM firmware become readable"
  - id: block-header-full
    what: "Full 256-byte 'M' block headers at CPU 0x00-0xFF of each 256 KB block"
    look_for: "Bytes following 4D at each 64 KB sector start in the partner lanes; chain flags 80/FF; a checksum whose MSB here is 12, A5, 2F, 4A, BA, BB, 9A, A7, 2E, 1A for blocks 0-9"
    why: "Would identify the flash container format and the image name/version"
  - id: arm-firmware
    what: "Complete big-endian ARM firmware at CPU 0x080300-0x0BFEC0 (chip 0x0200C0-0x02FFB0)"
    look_for: "Partner lanes carrying the low 24 bits of ARM instructions (register/immediate fields) in the same chip range"
    why: "Would identify the coprocessor or peripheral chip and so the device"
