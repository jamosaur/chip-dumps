    type: "Block header (lane 0 of CPU 0x00-0xFF), block 0"
    detail: "bytes 4,5 = chain flags (FF FF = standalone); byte 6 per-block varying (checksum MSB?); byte 8 = 80; byte 10 = FF"
    raw: "4D 00 00 00 FF FF 12 00 80 00 FF FF"
  - offset: "0x010000"
