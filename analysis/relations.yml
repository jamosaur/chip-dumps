    summary: "AM29F016B/8, 9 and 12 are byte lanes of three different Cisco 68k (2500-class) flash banks wired with fully reversed data bits, each holding a different run-from-flash image."
    evidence:
      - "After reversing every byte, each starts with a lane of a Cisco flash file header and an a.out header: 8 = 0B DB FF 00 '5js11i' / 01 3E 9D 04, 12 = 0B 6A FF 00 '5i14' / 01 50 1A B4, 9 = D0 4A 92 00 '2-.-i' / 02 49 01 05. So 8 and 12 are lane 2 (0B of BAD00B1E, 01 of 0x0107) and 9 is lane 1. 8's header was not recognised in its isolated analysis."
      - "They are not lanes of one bank. 8 and 12 are both lane 2 with different file names (character 6 'j' against 'i'). Data ends at 9:0x12AFD4, 12:0x139AC2 and 8:0x1FFFFF (no erased tail), so 9's bank-mates would end near 0x12AFD4."
      - "Bytes 0x1C-0x1F agree in form on 8 and 12 (B0 00 01 EE and B0 00 01 AC), and 9 and 12 carry 2500 banners (C2500-P-L, C2500-?-L)."
      - "MBM29F016A/11 (Cisco IGS lane 1, a different bit permutation, data to 0x0F5C4D) matches none of them."
    method: Read 3 header ranges with bit reversal, compared end offsets
    found: 2026-11-18
    status: current

