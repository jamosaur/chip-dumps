    confidence: high
    summary: "The nine NS-2482 flash-disk chips come from at least five units of the same product. All carry the same software install (Ver 2.2 of 1997-10-29, updated to Ver 3.1 of 1998-08-31), but their wear-levelling states differ."
    evidence:
      - "Chips from different units hold the same logical units with identical content. 4 and 19 share 29 identical units, 5, 13 and 17 share 22, 14 and 15 share 24, and 5 and 12 share 41, 48 and 5E. One volume holds each logical unit only once, so these chips belong to different units."
