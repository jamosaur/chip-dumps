      - "Inode tables 0-479 on 14 and 15 have identical sizes and block lists, but their change times are 1999-07-13 02:06 and 1999-07-12 06:20. Erase counts differ in both directions (sector 6 0x1A vs 0x1F, sector 9 0x08 vs 0x04), so these are two physical chips and not one chip dumped twice."
      - "Unit B (3, 13) has the same 480-590 files with the same sizes as unit A (19), allocated two blocks earlier, with change time 1999-03-25 06:11."
